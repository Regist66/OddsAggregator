name: oddsaggregator-direct-production

# Folyamatos, passzív direct canary profile.
# A szolgáltatások nem kapnak duration CLI-paramétert, ezért a collectorok és
# az aggregátor a SIGTERM-ig futnak. A runtime/direct-production könyvtár
# szándékosan nem a kanonikus runtime/data könyvtár.
services:
  sharpx-direct-production:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-direct-prod-sharpx
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /workspace
    volumes:
      - ../../src:/workspace/src:ro
      - ../../config:/workspace/config:ro
      - ../../runtime/direct-production:/workspace/runtime/direct-production
    environment:
      MONITOR_HEARTBEAT_FILE: /workspace/runtime/direct-production/sharpx_raw_snapshot.json
      MONITOR_STALE_MS: "${DIRECT_MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${DIRECT_MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${DIRECT_MONITOR_POLL_MS:-10000}"
      DIRECT_OUTPUT_STALE_MS: "${DIRECT_OUTPUT_STALE_MS:-120000}"
      DIRECT_OUTPUT_FUTURE_TOLERANCE_MS: "${DIRECT_OUTPUT_FUTURE_TOLERANCE_MS:-5000}"
    command:
      - node
      - /usr/local/bin/monitor-supervisor.mjs
      - src/sharpx_direct_shadow.js
      - --output-file
      - /workspace/runtime/direct-production/sharpx_raw_snapshot.json
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/direct-healthcheck.mjs", "sharpx", "/workspace/runtime/direct-production/sharpx_raw_snapshot.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: &direct-production-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tippmixpro-direct-production:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-direct-prod-tippmixpro
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /workspace
    depends_on:
      - sharpx-direct-production
    volumes:
      - ../../src:/workspace/src:ro
      - ../../config:/workspace/config:ro
      - ../../runtime/direct-production:/workspace/runtime/direct-production
    environment:
      MONITOR_HEARTBEAT_FILE: /workspace/runtime/direct-production/tippmixpro_raw_snapshot.json
      MONITOR_STALE_MS: "${DIRECT_MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${DIRECT_MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${DIRECT_MONITOR_POLL_MS:-10000}"
      DIRECT_OUTPUT_STALE_MS: "${DIRECT_OUTPUT_STALE_MS:-120000}"
      DIRECT_OUTPUT_FUTURE_TOLERANCE_MS: "${DIRECT_OUTPUT_FUTURE_TOLERANCE_MS:-5000}"
    command:
      - node
      - /usr/local/bin/monitor-supervisor.mjs
      - src/tippmixpro_direct_shadow.js
      - --output-file
      - /workspace/runtime/direct-production/tippmixpro_raw_snapshot.json
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/direct-healthcheck.mjs", "tippmixpro", "/workspace/runtime/direct-production/tippmixpro_raw_snapshot.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: *direct-production-logging

  vegas-direct-production:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-direct-prod-vegas
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /workspace
    depends_on:
      - sharpx-direct-production
    volumes:
      - ../../src:/workspace/src:ro
      - ../../config:/workspace/config:ro
      - ../../runtime/direct-production:/workspace/runtime/direct-production
    environment:
      MONITOR_HEARTBEAT_FILE: /workspace/runtime/direct-production/vegas_raw_snapshot.json
      MONITOR_STALE_MS: "${DIRECT_MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${DIRECT_MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${DIRECT_MONITOR_POLL_MS:-10000}"
      DIRECT_OUTPUT_STALE_MS: "${DIRECT_OUTPUT_STALE_MS:-120000}"
      DIRECT_OUTPUT_FUTURE_TOLERANCE_MS: "${DIRECT_OUTPUT_FUTURE_TOLERANCE_MS:-5000}"
    command:
      - node
      - /usr/local/bin/monitor-supervisor.mjs
      - src/vegas_direct_shadow.js
      - --output-file
      - /workspace/runtime/direct-production/vegas_raw_snapshot.json
      - --watchlist-file
      - /workspace/runtime/direct-production/sharpx_raw_snapshot.json
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/direct-healthcheck.mjs", "vegas", "/workspace/runtime/direct-production/vegas_raw_snapshot.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: *direct-production-logging

  aggregator-direct-production:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-direct-prod-aggregator
    network_mode: "none"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /workspace
    depends_on:
      - sharpx-direct-production
      - tippmixpro-direct-production
      - vegas-direct-production
    volumes:
      - ../../src:/workspace/src:ro
      - ../../config:/workspace/config:ro
      - ../../runtime/direct-production:/workspace/runtime/direct-production
    environment:
      DIRECT_SHARPX_SNAPSHOT_FILE: /workspace/runtime/direct-production/sharpx_raw_snapshot.json
      DIRECT_TIPPMIXPRO_SNAPSHOT_FILE: /workspace/runtime/direct-production/tippmixpro_raw_snapshot.json
      DIRECT_VEGAS_SNAPSHOT_FILE: /workspace/runtime/direct-production/vegas_raw_snapshot.json
      DIRECT_PRIMARY_OUTPUT_FILE: /workspace/runtime/direct-production/combined_odds.txt
      DIRECT_PRIMARY_SUREBETS_OUTPUT_FILE: /workspace/runtime/direct-production/football/surebets_live_odds.txt
      DIRECT_PRIMARY_WATCHLIST_FILE: /workspace/runtime/direct-production/sharpx_watchlist.json
      DIRECT_PRIMARY_STATUS_FILE: /workspace/runtime/direct-production/sharpx_status_snapshot.json
      DIRECT_PRIMARY_HEALTH_FILE: /workspace/runtime/direct-production/direct_primary_health.json
      TEAM_ALIASES_FILE: /workspace/config/team_aliases.json
      MONITOR_HEARTBEAT_FILE: /workspace/runtime/direct-production/direct_primary_health.json
      MONITOR_STALE_MS: "${DIRECT_MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${DIRECT_MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${DIRECT_MONITOR_POLL_MS:-10000}"
      DIRECT_OUTPUT_STALE_MS: "${DIRECT_OUTPUT_STALE_MS:-120000}"
      DIRECT_OUTPUT_FUTURE_TOLERANCE_MS: "${DIRECT_OUTPUT_FUTURE_TOLERANCE_MS:-5000}"
    command: ["node", "/usr/local/bin/monitor-supervisor.mjs", "src/direct_primary_aggregator.js"]
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/direct-healthcheck.mjs", "primary", "/workspace/runtime/direct-production/direct_primary_health.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: *direct-production-logging
