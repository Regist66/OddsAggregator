name: oddsaggregator

services:
  chrome:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-chrome
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    shm_size: "1gb"
    volumes:
      - chrome-profile:/chrome-profile
    command: ["node", "/usr/local/bin/start-chrome.mjs"]
    healthcheck:
      test:
        - CMD
        - node
        - /usr/local/bin/chrome-healthcheck.mjs
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  tippmixpro:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-tippmixpro
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      chrome:
        condition: service_healthy
    volumes:
      - ../../runtime/data:/app/data
    environment:
      TIPPMIXPRO_CDP_ENDPOINT: http://127.0.0.1:9333
      TIPPMIXPRO_OUTPUT_FILE: /app/data/tippmixpro_headless_odds_snapshot.json
      TIPPMIXPRO_SNAPSHOT_FILE: /app/data/tippmixpro_headless_odds_snapshot.json
      MONITOR_HEARTBEAT_FILE: /app/data/tippmixpro_headless_odds_snapshot.json
      MONITOR_STALE_MS: "${MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${MONITOR_POLL_MS:-10000}"
    command: ["node", "/usr/local/bin/monitor-supervisor.mjs", "src/tippmixpro_odds_monitor.js"]
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/monitor-healthcheck.mjs", "/app/data/tippmixpro_headless_odds_snapshot.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  tippmixpro-direct:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-tippmixpro-direct
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /workspace
    volumes:
      - ../../src:/workspace/src:ro
      - ../../runtime/data:/workspace/runtime/data
    environment:
      MONITOR_HEARTBEAT_FILE: /workspace/runtime/data/tippmixpro_direct_odds_snapshot.json
      MONITOR_STALE_MS: "${TIPPMIXPRO_DIRECT_MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${TIPPMIXPRO_DIRECT_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${TIPPMIXPRO_DIRECT_MONITOR_POLL_MS:-10000}"
      DIRECT_OUTPUT_STALE_MS: "${TIPPMIXPRO_DIRECT_OUTPUT_STALE_MS:-120000}"
      DIRECT_OUTPUT_FUTURE_TOLERANCE_MS: "${TIPPMIXPRO_DIRECT_OUTPUT_FUTURE_TOLERANCE_MS:-5000}"
    command:
      - node
      - /usr/local/bin/monitor-supervisor.mjs
      - src/tippmixpro_direct_shadow.js
      - --output-file
      - /workspace/runtime/data/tippmixpro_direct_odds_snapshot.json
    healthcheck:
      test:
        - CMD
        - node
        - /usr/local/bin/direct-healthcheck.mjs
        - tippmixpro
        - /workspace/runtime/data/tippmixpro_direct_odds_snapshot.json
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  tippmixpro-selector:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-tippmixpro-selector
    network_mode: "none"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    working_dir: /workspace
    depends_on:
      tippmixpro:
        condition: service_started
      tippmixpro-direct:
        condition: service_started
    volumes:
      - ../../src:/workspace/src:ro
      - ../../runtime/data:/workspace/runtime/data
    environment:
      MONITOR_HEARTBEAT_FILE: /workspace/runtime/data/tippmixpro_odds_snapshot.json
      MONITOR_STALE_MS: "${TIPPMIXPRO_SELECTOR_MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${TIPPMIXPRO_SELECTOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${TIPPMIXPRO_SELECTOR_MONITOR_POLL_MS:-10000}"
      TIPPMIXPRO_DIRECT_SNAPSHOT_FILE: /workspace/runtime/data/tippmixpro_direct_odds_snapshot.json
      TIPPMIXPRO_HEADLESS_SNAPSHOT_FILE: /workspace/runtime/data/tippmixpro_headless_odds_snapshot.json
      TIPPMIXPRO_CANONICAL_SNAPSHOT_FILE: /workspace/runtime/data/tippmixpro_odds_snapshot.json
      TIPPMIXPRO_SELECTOR_HEALTH_FILE: /workspace/runtime/data/tippmixpro_production_health.json
      TIPPMIXPRO_SELECTOR_POLL_MS: "${TIPPMIXPRO_SELECTOR_POLL_MS:-1000}"
      TIPPMIXPRO_SELECTOR_SNAPSHOT_MAX_AGE_MS: "${TIPPMIXPRO_SELECTOR_SNAPSHOT_MAX_AGE_MS:-10000}"
      TIPPMIXPRO_SELECTOR_SOURCE_MAX_AGE_MS: "${TIPPMIXPRO_SELECTOR_SOURCE_MAX_AGE_MS:-15000}"
      TIPPMIXPRO_SELECTOR_FUTURE_TOLERANCE_MS: "${TIPPMIXPRO_SELECTOR_FUTURE_TOLERANCE_MS:-5000}"
    command: ["node", "/usr/local/bin/monitor-supervisor.mjs", "src/tippmixpro_production_selector.js"]
    healthcheck:
      test:
        - CMD
        - node
        - /usr/local/bin/direct-healthcheck.mjs
        - tippmixpro
        - /workspace/runtime/data/tippmixpro_odds_snapshot.json
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  sharpx:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-sharpx
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      chrome:
        condition: service_healthy
      tippmixpro-selector:
        condition: service_started
    volumes:
      - ../../runtime/data:/app/data
    environment:
      SHARPX_CDP_ENDPOINT: http://127.0.0.1:9333
      SHARPX_CDP_COMMAND_TIMEOUT_MS: "${SHARPX_CDP_COMMAND_TIMEOUT_MS:-60000}"
      SHARPX_OUTPUT_FILE: /app/data/combined_odds.txt
      SUREBETS_OUTPUT_FILE: /app/data/football/surebets_live_odds.txt
      SHARPX_WATCHLIST_FILE: /app/data/sharpx_watchlist.json
      SHARPX_STATUS_SNAPSHOT_FILE: /app/data/sharpx_status_snapshot.json
      SHARPX_OUTPUT_STATE_FILE: /app/data/sharpx_output_state.json
      SHARPX_OUTPUT_MIN_COVERAGE_RATIO: "${SHARPX_OUTPUT_MIN_COVERAGE_RATIO:-0.90}"
      SHARPX_LAST_GOOD_OUTPUT_TTL_MS: "${SHARPX_LAST_GOOD_OUTPUT_TTL_MS:-300000}"
      SHARPX_WEBSOCKET_HANDSHAKE_TIMEOUT_MS: "${SHARPX_WEBSOCKET_HANDSHAKE_TIMEOUT_MS:-10000}"
      SHARPX_WEBSOCKET_FRAME_TIMEOUT_MS: "${SHARPX_WEBSOCKET_FRAME_TIMEOUT_MS:-30000}"
      SHARPX_WEBSOCKET_RECONNECT_BASE_MS: "${SHARPX_WEBSOCKET_RECONNECT_BASE_MS:-1000}"
      SHARPX_WEBSOCKET_RECONNECT_MAX_MS: "${SHARPX_WEBSOCKET_RECONNECT_MAX_MS:-10000}"
      SHARPX_ALL_SOCKET_RECOVERY_MS: "${SHARPX_ALL_SOCKET_RECOVERY_MS:-30000}"
      TIPPMIXPRO_SNAPSHOT_FILE: /app/data/tippmixpro_odds_snapshot.json
      VEGAS_SNAPSHOT_FILE: /app/data/vegas_odds_snapshot.json
      MONITOR_HEARTBEAT_FILE: /app/data/sharpx_status_snapshot.json
      MONITOR_STALE_MS: "${MONITOR_STALE_MS:-120000}"
      MONITOR_VALIDATE_CONTENT: "1"
      MONITOR_MIN_COVERAGE_RATIO: "${SHARPX_OUTPUT_MIN_COVERAGE_RATIO:-0.90}"
      MONITOR_STARTUP_GRACE_MS: "${MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${MONITOR_POLL_MS:-10000}"
    command: ["node", "/usr/local/bin/monitor-supervisor.mjs", "src/sharpx_odds_monitor.js"]
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/monitor-healthcheck.mjs", "/app/data/sharpx_status_snapshot.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  vegas:
    image: oddsaggregator-headless:local
    container_name: oddsaggregator-vegas
    network_mode: "container:pia-gluetun"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      chrome:
        condition: service_healthy
    volumes:
      - ../../runtime/data:/app/data
    environment:
      VEGAS_CDP_ENDPOINT: http://127.0.0.1:9333
      VEGAS_OUTPUT_FILE: /app/data/vegas_odds_snapshot.json
      VEGAS_SNAPSHOT_FILE: /app/data/vegas_odds_snapshot.json
      VEGAS_LIVE_REQUEST_BUDGET_MS: "${VEGAS_LIVE_REQUEST_BUDGET_MS:-4500}"
      VEGAS_LIVE_FAILURE_BACKOFF_MS: "${VEGAS_LIVE_FAILURE_BACKOFF_MS:-1000}"
      VEGAS_LIVE_FAILURE_BACKOFF_MAX_MS: "${VEGAS_LIVE_FAILURE_BACKOFF_MAX_MS:-10000}"
      VEGAS_LIVE_INITIAL_DELAY_MS: "${VEGAS_LIVE_INITIAL_DELAY_MS:-0}"
      VEGAS_LIVE_LATENCY_SAMPLE_SIZE: "${VEGAS_LIVE_LATENCY_SAMPLE_SIZE:-600}"
      VEGAS_ENHANCED_DETAIL_CONCURRENCY: "${VEGAS_ENHANCED_DETAIL_CONCURRENCY:-12}"
      SHARPX_WATCHLIST_FILE: /app/data/sharpx_watchlist.json
      MONITOR_HEARTBEAT_FILE: /app/data/vegas_odds_snapshot.json
      MONITOR_STALE_MS: "${MONITOR_STALE_MS:-120000}"
      MONITOR_STARTUP_GRACE_MS: "${MONITOR_STARTUP_GRACE_MS:-180000}"
      MONITOR_POLL_MS: "${MONITOR_POLL_MS:-10000}"
    command: ["node", "/usr/local/bin/monitor-supervisor.mjs", "src/vegas_odds_monitor.js"]
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/monitor-healthcheck.mjs", "/app/data/vegas_odds_snapshot.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  chrome-profile:
